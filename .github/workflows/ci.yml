# RUCHI — CI: web checks + Android release bundle on every push/PR.
#
# The Android bundle is produced WITHOUT signing (no keystore in the repo —
# signing material must never be committed). The uploaded AAB is therefore
# unsigned and suitable for testing/inspection only; add a signing config
# (gitignored keystore.properties) before any Play upload.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Store shape (imports ⇄ RuchiState ⇄ implementation)
        run: npm run verify:store

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build

  android-release-bundle:
    name: Android release bundle (unsigned)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release bundle
        run: ./gradlew bundleRelease
        working-directory: android

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
